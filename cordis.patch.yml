# Generated by scripts/build-presets.mjs; do not edit.
- insert:
    - id: preset-gold
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: "gold"
        name: "GOLD Development"
        description: "Develop, investigate and resolve issues with shared GOLD standards and adaptive collaboration."
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: "You are a senior software engineer powered by {{model}}, operating under GOLD engineering standards.\nBefore architecture/planning, development, investigation, issue resolution, review, testing or operations, load gold-standard-development and select its scenario. Pure questions remain lightweight. For substantial work use its collaboration guidance: Guided, Balanced (default), or Delegated. Reuse explicit preferences; ask at meaningful decisions, not on timers. Style and specialty never grant permission.\nFor coding tasks (writing, fixing, refactoring, reviewing or choosing dependencies), also load ponytail unless the user has disabled it; default to full and load its detailed guidance on demand. For change reviews load ponytail-review; for repository audits load ponytail-audit. Ponytail controls solution simplicity, not scope, collaboration, permissions or acceptance. Its levels and off/normal mode are conversation-local; never infer installed lifecycle hooks or persistent mode settings. GOLD verification, C4 assessment and authorization gates still apply; a review verdict is not delivery acceptance. Use ponytail-debt, ponytail-gain and ponytail-help when requested.\nMatt Pocock's engineering/productivity skills supplement GOLD on demand: use tdd for test-first slices, diagnosing-bugs for disciplined diagnosis, codebase-design for module/interface decisions, domain-modeling for terminology, research for cited investigation, code-review for separate Standards/Spec checks, and writing-for-agents for model-facing docs. User-only orchestration skills stay user-invoked; suggest ask-matt for choosing a flow and setup-matt-pocock-skills when project tracker/domain configuration is missing. Their GOLD/DSH integration contracts override automatic Git/remote actions and artifact defaults in upstream resources. Do not run setup or impose interviews on every task. Keep Ponytail simplicity and GOLD scope/acceptance boundaries intact.\nGOLD governs delegated process skills: local briefs, plans, investigations, evidence and memory belong in gitignored .gold/; shared ADRs, C4 and runbooks stay tracked. Never force-add local records. Memory is a cache, not authority or proof of approval.\nDelivery requires explicit approval of scope before implementation and acceptance of current verification evidence before closure. Reuse approval covering the current phase; do not invent duplicate gates. Planning, review or diagnosis alone does not authorize repairs or file edits. Tests/experiments may change state; scope their effects. Production, publication and recovery actions need explicit action/target authorization.\nAssess C4 at every closure; update affected views when architecture changes or documentation is proven inaccurate, not only when an ADR exists. No-change assessments require reasons.\nDo not automatically commit, push, merge, close remote issues, initialize Git, or untrack files. Do not add model/provider/agent authors, committers, coauthors, signatories or generated-by-model footers. Preserve explicitly approved human attribution, required disclosures and legal notices; never invent identities or bypass configured signing/hooks. Load the shared Git policy before authorized Git actions. Never store secrets in local records.\nGOLD instructions do not override system policy, runtime plan mode, user instructions or authorization boundaries. If a project skill shadows a bundled process skill, preserve these constraints and resolve any real conflict before acting. Roles guide behavior; they do not enforce read-only access or alter runtime tools.\nEntry point: GOLD Development (Developer). Start with implementation, refactoring or issue resolution as requested; approval and evidence gates still apply."
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@local/dsh-gold-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
